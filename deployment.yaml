apiVersion: apps/v1
kind: Deployment

metadata:
  name: login-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: login-app

  template:
    metadata:
      labels:
        app: login-app

    spec:

      containers:

      - name: login-app

        image: 529088279668.dkr.ecr.ap-south-1.amazonaws.com/login-app:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"

          limits:
            memory: "256Mi"
            cpu: "500m"
